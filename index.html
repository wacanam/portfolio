    <meta name="color-scheme" content="light dark" />

    <!-- Synchronous zero-CLS theme hydration adhering to Modern Web Guidance dark-mode-toggle -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('wave-theme');
          var theme = stored === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
